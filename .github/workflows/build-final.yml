# Builds and pushes the Play Lap Game Agent Server image.
#
# NOTE: this workflow lives inside game-agent-server/. GitHub only runs
# workflows from the repository root's .github/workflows/. Two options:
#   A) Push game-agent-server/ as its OWN repository (recommended — the
#      server is standalone). Then this file is already in the right place
#      once the folder becomes the repo root.
#   B) Keep the monorepo: copy this file to <repo-root>/.github/workflows/.
#      The paths below already account for the game-agent-server/ prefix via
#      the `context` input — adjust `WORKING_DIR` if you move things around.
#
# Required repository secrets (Settings → Secrets → Actions):
#   - For GHCR: nothing extra (uses the built-in GITHUB_TOKEN).
#   - For Docker Hub (optional): DOCKERHUB_USERNAME + DOCKERHUB_TOKEN.
name: Build & Push Game Agent Server image

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

env:
  WORKING_DIR: game-agent-server
  IMAGE_NAME: ${{ github.repository_owner }}/playlap-game-agent-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # CUDA base images are huge; the default runner disk fills up mid-build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup \
            /usr/share/swift /usr/local/julia* || true
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      # If this repo IS game-agent-server itself, fix the context path.
      - name: Resolve build context
        id: ctx
        run: |
          if [ -f "${WORKING_DIR}/Dockerfile" ]; then
            echo "dir=${WORKING_DIR}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.dir }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
