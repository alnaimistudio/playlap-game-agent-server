<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Orb Runner 3D</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0e1a; }
  #renderCanvas { width: 100vw; height: 100vh; touch-action: none; display: block; }
  #hud { position: fixed; top: env(safe-area-inset-top, 8px); left: 0; right: 0; display: flex; justify-content: space-between; padding: 14px 18px; font: bold 24px system-ui, sans-serif; color: #fff; pointer-events: none; text-shadow: 0 2px 6px #000; }
  #banner { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(4,8,18,.75); color: #fff; font: bold 42px system-ui, sans-serif; gap: 24px; }
  #restart { font: bold 26px system-ui, sans-serif; background: #238636; color: #fff; border: 0; border-radius: 12px; padding: 18px 40px; }
  #hint { position: fixed; bottom: calc(env(safe-area-inset-bottom, 8px) + 24px); left: 0; right: 0; text-align: center; font: 20px system-ui, sans-serif; color: #ffd166; pointer-events: none; text-shadow: 0 2px 6px #000; }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="hud"><span id="score">Orbs 0/8</span><span id="timer">45s</span></div>
<div id="hint">Tap anywhere to roll toward it</div>
<div id="banner"><span id="bannerText"></span><button id="restart">PLAY AGAIN</button></div>
<script src="vendor/babylon.js"></script>
<script src="src/game.js"></script>
</body>
</html>
